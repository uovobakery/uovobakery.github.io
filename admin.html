<style>
:root { --blue:#0F59C4; --blue-deep:#0B3F91; --sky:#EAF2FD; --line:#D5E2F7; --ink:#0C2247; --soft:#5A6B8C; --ok:#1B7A3A; --err:#B3261E; --warn:#B26A00; --paper:#fff; --bg:#F5F8FD;
  --fd:"Fredoka","Trebuchet MS",system-ui,sans-serif; --fb:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif; color-scheme:light; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 var(--fb); }
body { min-height:100vh; padding-bottom:calc(76px + env(safe-area-inset-bottom)); }
button,input { font:inherit; color:inherit; }
button { cursor:pointer; }
[hidden] { display:none !important; }
.top { display:grid !important; grid-template-columns:1fr auto 1fr; position:sticky; top:0; z-index:20; background:var(--blue); color:#fff; padding:calc(10px + env(safe-area-inset-top)) 16px 10px; display:flex; align-items:center; gap:10px; }
.top h1 { font:600 1.05rem var(--fd); margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.top .hlogo { height:34px; width:auto; justify-self:center; display:block; }
.top .tacts { justify-self:end; grid-column:3; display:flex; gap:6px; align-items:center; }
.top small { opacity:.85; font-size:.75rem; display:block; font-weight:600; }
.ibtn { border:0; background:rgba(255,255,255,.18); color:#fff; width:40px; height:40px; border-radius:50%; font-size:1.2rem; display:grid; place-items:center; }
.wrap { max-width:720px; margin:0 auto; padding:12px 14px 20px; }
.nav { position:fixed; left:0; right:0; bottom:0; z-index:20; background:#fff; border-top:1px solid var(--line); display:flex; padding-bottom:env(safe-area-inset-bottom); }
.nav button { flex:1; border:0; background:none; padding:10px 4px 9px; display:grid; gap:2px; justify-items:center; font-size:.72rem; font-weight:700; color:var(--soft); }
.nav button svg { width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
.nav button.on { color:var(--blue); }
.chips { display:flex; gap:8px; overflow-x:auto; padding:2px 0 10px; scrollbar-width:none; }
.chips::-webkit-scrollbar { display:none; }
.chip { flex:none; border:1.5px solid var(--line); background:#fff; border-radius:999px; padding:7px 13px; font-weight:700; font-size:.85rem; color:var(--soft); }
.chip b { font-weight:800; margin-left:4px; }
.chip.on { background:var(--blue); border-color:var(--blue); color:#fff; }
.sm.on { background:var(--blue); border-color:var(--blue); color:#fff; }
.search { width:100%; border:1.5px solid var(--line); border-radius:12px; padding:11px 14px; background:#fff; margin-bottom:10px; }
.search:focus,.inp:focus { outline:2px solid #6FA4F2; border-color:var(--blue); }
.card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:12px; box-shadow:0 1px 3px rgba(12,34,71,.05); }
.card.dim { opacity:.62; }
.row { display:flex; align-items:flex-start; gap:10px; justify-content:space-between; }
.nm { font:600 1.05rem var(--fd); }
.id { color:var(--soft); font-size:.75rem; font-weight:700; }
.tot { font:600 1.1rem var(--fd); color:var(--blue); white-space:nowrap; }
.meta { color:var(--soft); font-size:.82rem; margin-top:2px; }
.items { margin:8px 0; padding:9px 11px; background:var(--sky); border-radius:10px; font-size:.9rem; white-space:pre-wrap; word-break:break-word; }
.note { font-size:.82rem; color:var(--warn); font-weight:700; margin-bottom:8px; }
.tgl { display:flex; gap:8px; flex-wrap:wrap; margin-top:6px; }
.tg { flex:1 1 90px; border:2px solid var(--line); background:#fff; border-radius:12px; padding:10px 6px; font-weight:800; font-size:.88rem; color:var(--soft); display:flex; align-items:center; justify-content:center; gap:6px; }
.tg.on { background:var(--ok); border-color:var(--ok); color:#fff; }
.tg:disabled { opacity:.5; }
.acts { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
.sm { border:1.5px solid var(--line); background:#fff; border-radius:10px; padding:7px 12px; font-weight:700; font-size:.82rem; color:var(--blue); text-decoration:none; display:inline-block; }
.sm.red { color:var(--err); border-color:#F0C2BE; }
.sm.red.arm { background:var(--err); color:#fff; border-color:var(--err); }
.badge { display:inline-block; font-size:.72rem; font-weight:800; padding:2px 9px; border-radius:999px; background:#FDE7E5; color:var(--err); }
.badge.g { background:#E3F4E8; color:var(--ok); } .badge.b { background:var(--sky); color:var(--blue); } .badge.r { background:#FDE7E5; color:var(--err); } .badge.y { background:#FFF1D6; color:#8a6100; } .skr{border-left:4px solid #b3261e}.sky{border-left:4px solid #e0a100}
.badge.o { background:#FFF1D6; color:var(--warn); }
.inp { border:1.5px solid var(--line); border-radius:10px; padding:9px 11px; background:#fff; width:100%; }
.pr { display:flex; align-items:center; gap:6px; }

.pr .inp { width:110px; font-weight:700; }
.sw { display:flex; align-items:center; gap:8px; font-weight:700; font-size:.85rem; color:var(--soft); }
.sw i { width:44px; height:26px; border-radius:999px; background:#C5D0E3; position:relative; transition:.15s; flex:none; }
.sw i::after { content:""; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:.15s; }
.sw.on i { background:var(--ok); } .sw.on i::after { left:21px; }
.sw.warn.on i { background:var(--err); }
.help { background:var(--sky); border-radius:12px; padding:11px 13px; font-size:.86rem; color:var(--ink); margin-bottom:12px; }
.empty { text-align:center; color:var(--soft); padding:34px 10px; }
.login { min-height:100vh; display:grid; place-content:center; justify-items:center; gap:18px; text-align:center; padding:24px; }
.login img { width:150px; }
.login h2 { font:600 1.3rem var(--fd); margin:0; }
.login p { color:var(--soft); margin:0; max-width:300px; }
.err { color:var(--err); font-weight:700; max-width:320px; }
.toast { position:fixed; left:50%; bottom:calc(88px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 16px; border-radius:12px; font-weight:700; font-size:.88rem; z-index:50; max-width:90vw; }
.demo { background:#FFF1D6; color:var(--warn); text-align:center; font-weight:800; font-size:.78rem; padding:4px; }
.add { display:grid; gap:8px; margin-top:6px; }
.btn { border:0; background:var(--blue); color:#fff; border-radius:12px; padding:12px; font-weight:800; }
.btn:disabled { opacity:.5; }

.ntp{position:fixed;top:64px;left:10px;right:10px;max-width:460px;margin:0 auto;max-height:68vh;overflow:auto;background:#fff;border-radius:20px;box-shadow:0 14px 40px rgba(11,40,100,.35);z-index:80;padding:12px 12px 8px}
.ntp .nh{display:flex;align-items:center;gap:8px;margin-bottom:8px}.ntp .nh b{flex:1;font-size:1rem}.ntp .sw{margin-bottom:8px}
.nti{display:flex;gap:10px;align-items:flex-start}.nti .ne{font-size:1.25rem;line-height:1.2}.nti .nx{font-weight:700;font-size:.86rem;line-height:1.25}.nti .ns{font-size:.72rem;color:var(--soft)}
.nrd{display:block;width:100%;border:0;background:none;text-align:center;font:600 .68rem Nunito,sans-serif;color:var(--soft);opacity:.45;padding:6px 0 2px}
.ntp .empty{padding:14px 0;font-size:.85rem}
.ckr{display:flex;align-items:center;gap:6px;padding:6px 0}.ckr .sm{padding:2px 10px}
.ibtn svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.kpi{background:#fff;border-radius:16px;padding:14px 8px;text-align:center;border:1px solid #e3eaf6;font:inherit;color:inherit}

.rl{display:flex;gap:6px;align-items:center}.rl select{flex:1;min-width:0}.rl .u{min-width:34px;font-size:.8rem;color:#667}
.back{border:0;background:none;color:#0F59C4;font:inherit;font-weight:700;padding:4px 0 10px}

.sw{position:relative;overflow:hidden;border-radius:16px;margin-bottom:12px}.sw .card{margin-bottom:0;position:relative;transition:transform .2s;touch-action:pan-y}.swb{position:absolute;right:0;top:0;bottom:0;width:84px;background:#d93a2f;color:#fff;border:0;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:opacity .15s}.sw[data-kind]{display:block;gap:0;font-size:inherit;font-weight:inherit;color:inherit;width:100%}.sw[data-kind] .pc{width:100%;box-sizing:border-box}.ipd{width:100%;text-align:left;cursor:pointer}.swl{position:absolute;left:0;top:0;bottom:0;width:84px;background:#1f9d55;color:#fff;border:0;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:opacity .15s;font-weight:800;font-size:.8rem;text-align:center;padding:4px}.swl.o{background:#e08a00}.sw.sxr .swb,.sw.sxl .swl{opacity:1;visibility:visible}.bpl{margin:8px 0;padding:10px;border:1px solid #dde6f4;border-radius:12px}

/* ===== refresh visual ===== */
:root{--bg:#F1F5FC;--shadow:0 6px 22px rgba(15,60,140,.08);--shadow2:0 2px 8px rgba(15,60,140,.07)}
body{background:radial-gradient(1200px 500px at 50% -120px,#DCE9FF 0,transparent 70%),var(--bg);background-attachment:fixed}
.top{background:linear-gradient(135deg,#0F59C4,#0B3F91);border-radius:0 0 22px 22px;box-shadow:0 6px 18px rgba(11,63,145,.25);padding-bottom:14px}
.card{border:0;border-radius:20px;box-shadow:var(--shadow)}#view.enter .card{animation:rise .28s ease backwards}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hero{background:linear-gradient(135deg,#1F6FE0,#0B3F91);border-radius:20px;box-shadow:0 8px 18px rgba(11,63,145,.22);padding:12px 16px;margin-bottom:10px}
.hero b{font-size:1.65rem;letter-spacing:-.5px;margin:2px 0}.hero small{font-size:.78rem}
.kpi{border:0;border-radius:20px;box-shadow:var(--shadow2);transition:transform .12s}
.kpi:active,.card:active,.chip:active,.sm:active,.btn:active,.mi:active{transform:scale(.97)}
.btn{background:linear-gradient(135deg,#1F6FE0,#0F59C4);border-radius:14px;padding:14px;box-shadow:0 6px 14px rgba(15,89,196,.25);transition:transform .12s}
.sm{border-radius:12px;padding:8px 14px;background:#F6F9FF}
.chip{border:0;box-shadow:var(--shadow2);padding:8px 15px}
.chip.on{background:linear-gradient(135deg,#1F6FE0,#0F59C4);box-shadow:0 4px 12px rgba(15,89,196,.3)}
.search,.inp{border:1.5px solid #E1EAF8;border-radius:14px;background:#fff;padding:12px 14px}
.nav{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));border:0;border-radius:24px;box-shadow:0 10px 30px rgba(11,40,100,.18);background:rgba(255,255,255,.94);backdrop-filter:blur(14px);padding-bottom:0;overflow:hidden}
.nav button{padding:11px 2px 9px;transition:color .15s}.nav button.on{color:var(--blue)}.nav button.on svg{transform:translateY(-2px) scale(1.1)}.nav button svg{transition:transform .15s}
body{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.toast{z-index:300!important;bottom:calc(104px + env(safe-area-inset-bottom));border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.modal{backdrop-filter:blur(3px);place-items:center;padding:18px}.modal .box{border-radius:24px;max-width:420px;width:100%;margin:0 auto;padding:22px 20px;animation:pop .22s ease backwards;box-shadow:0 20px 60px rgba(0,0,0,.3);max-height:86vh;overflow:auto}
.modal .box>.btn{width:100%}.modal .box .sw .card{box-shadow:0 0 0 1px #E1EAF8}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.sw[data-kind]{border-radius:20px}.sw[data-kind] .card{box-shadow:var(--shadow)}
.sw.selon .pc{outline:3px solid #0F59C4;outline-offset:-3px;background:#EAF2FD}.sw.selon{position:relative}.sw.selon::after{content:"✓";position:absolute;top:8px;right:10px;width:24px;height:24px;border-radius:50%;background:#0F59C4;color:#fff;display:grid;place-items:center;font-weight:800;font-size:.85rem;z-index:3}
