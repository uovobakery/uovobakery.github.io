      var kdl = t.closest("[data-kdel]"); if (kdl) {
        if (kdl.classList.contains("arm")) api("delPack", { r: st.pd.r, orig: st.pd.orig }).then(function (j) { if (j && j.ok) { st.packs = j.packs; st.pd = null; render(true); toast("Eliminado"); } else toast(j && j.msg || "No se pudo"); });
        else { kdl.classList.add("arm"); kdl.textContent = "¿Seguro? Tocá de nuevo"; clearTimeout(armTimer); armTimer = setTimeout(function () { kdl.classList.remove("arm"); kdl.textContent = "Eliminar"; }, 3000); }
        return;
      }
    }
    if (t.closest("[data-rnew]")) { st.rd = { orig: "", nombre: "", y: 0, items: [{ n: "", q: "" }] }; render(true); return; }
    if (t.closest("[data-redit]")) { var rn = t.closest(".card").getAttribute("data-rn"), rx = st.recetas.filter(function (x) { return x.nombre === rn; })[0]; st.rd = st.rd && st.rd.orig === rn ? null : { orig: rn, nombre: rn, y: rx.y, items: rx.items.map(function (i) { return { n: i.n, q: i.q }; }) }; render(true); return; }
    if (st.rd) {
      if (t.closest("[data-riadd]")) { st.rd.items.push({ n: "", q: "" }); render(true); return; }
      var rxx = t.closest("[data-rix]"); if (rxx) { st.rd.items.splice(Number(rxx.getAttribute("data-rix")), 1); render(true); return; }
      if (t.closest("[data-rcancel]")) { st.rd = null; render(true); return; }
      if (t.closest("[data-rsave]")) {
        var rd = st.rd; t.closest("[data-rsave]").disabled = true;
        api("saveReceta", { nombre: rd.nombre, y: rd.y, items: rd.items.map(function (i) { return [i.n, i.q]; }) }).then(function (j) { if (j && j.ok) { st.recetas = j.recetas; st.insumos = j.insumos; st.rd = null; st.loaded.productos = false; render(true); var rr = j.recetas.filter(function (x) { return x.nombre.toLowerCase() === rd.nombre.toLowerCase(); })[0]; toast("Receta guardada ✓" + (rr ? " · " + money(rr.costo) + " por cookie" : "")); } else { toast(j && j.msg || "No se pudo guardar"); render(true); } }).catch(function () { render(true); });
        return;
      }
      var rdl = t.closest("[data-rdel]"); if (rdl) {
        if (rdl.classList.contains("arm")) api("delReceta", { nombre: st.rd.orig }).then(function (j) { if (j && j.ok) { st.recetas = j.recetas; st.rd = null; st.loaded.productos = false; render(true); toast("Receta eliminada"); } else toast(j && j.msg || "No se pudo"); });
        else { rdl.classList.add("arm"); rdl.textContent = "¿Seguro? Tocá de nuevo"; clearTimeout(armTimer); armTimer = setTimeout(function () { rdl.classList.remove("arm"); rdl.textContent = "Eliminar"; }, 3000); }
        return;
      }
    }
    var pt = t.closest("[data-pvt]"); if (pt) { st.pvt = pt.getAttribute("data-pvt"); render(true); return; }
    var fc = t.closest("[data-fc]"); if (fc) { st.fc = Number(fc.getAttribute("data-fc")); render(true); return; }
    var yr = t.closest("[data-yr]"); if (yr) { var ny = Number(st.fin.anio) + Number(yr.getAttribute("data-yr")); api("setAnio", { valor: ny }).then(function (j) { if (j && j.ok) { st.fin = j; render(true); } else toast(j && j.msg || "No se pudo"); }); return; }
    if (t.closest("#a-add")) {
      var em = $("a-mail").value.trim(), nt = $("a-nota").value.trim(); if (!em) return;
      t.closest("#a-add").disabled = true;
      api("addAcceso", { email: em, nota: nt }).then(function (j) { if (j && j.ok) { st.accesos = j.accesos; render(); toast("Acceso otorgado a " + em); } else { toast(j && j.msg || "No se pudo"); render(); } }).catch(function () { render(); });
      return;
    }
    var card = t.closest(".card"); if (!card) return; var r = Number(card.getAttribute("data-r"));
    if (st.v === "pedidos") {
      var tg = t.closest("[data-t]");
      if (tg) {
        var p = st.pedidos.filter(function (x) { return x.r === r; })[0], c = tg.getAttribute("data-t");
        if (c === "cc") patchPedido(r, "cc", false); else patchPedido(r, c, !p[c]);
        return;
      }
      if (t.closest("[data-note]")) {
        var pp = st.pedidos.filter(function (x) { return x.r === r; })[0], n = prompt("Nota del pedido:", pp.notas || "");
        if (n !== null) patchPedido(r, "notas", n); return;
      }
      var cc = t.closest("[data-cc]");
      if (cc) { if (cc.classList.contains("arm")) { patchPedido(r, "cc", true); } else { cc.classList.add("arm"); cc.textContent = "¿Seguro? Tocá de nuevo"; clearTimeout(armTimer); armTimer = setTimeout(function () { cc.classList.remove("arm"); cc.textContent = "Cancelar pedido"; }, 3000); } }
    } else if (st.v === "productos") {
      if (t.closest("[data-edit]")) { st.edit = st.edit === r ? 0 : r; render(true); return; }
      if (t.closest("[data-clip]")) { toast("Las fotos llegan en el próximo paso 📎"); return; }
      var sw = t.closest("[data-sw]"); if (!sw) return;
      var pr = st.productos.filter(function (x) { return x.r === r; })[0], k = sw.getAttribute("data-sw");
      patchProducto(r, k, !pr[k]);
    } else if (st.v === "packs") {
      if (t.closest("[data-pksw]")) { var pk = st.packs.filter(function (x) { return x.r === r; })[0]; patchPack(r, "ac", !pk.ac); }
    } else if (st.v === "accesos") {
      if (t.closest("[data-ac]")) {
        var a = st.accesos.filter(function (x) { return x.r === r; })[0];
        api("setAcceso", { r: r, activo: !a.activo }).then(function (j) { if (j && j.ok) { st.accesos = j.accesos; render(true); } });
      } else {
        var d = t.closest("[data-del]"); if (!d) return;
        if (d.classList.contains("arm")) api("delAcceso", { r: r }).then(function (j) { if (j && j.ok) { st.accesos = j.accesos; render(true); toast("Acceso quitado"); } });
        else { d.classList.add("arm"); d.textContent = "¿Seguro? Tocá de nuevo"; clearTimeout(armTimer); armTimer = setTimeout(function () { d.classList.remove("arm"); d.textContent = "Quitar acceso"; }, 3000); }
      }
    }
  });

  if ("serviceWorker" in navigator && !DEMO) navigator.serviceWorker.register("admin-sw.js").catch(function () {});
  boot();
})();
</script>
