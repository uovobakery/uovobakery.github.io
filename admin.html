<style>
:root { --blue:#0F59C4; --blue-deep:#0B3F91; --sky:#EAF2FD; --line:#D5E2F7; --ink:#0C2247; --soft:#5A6B8C; --ok:#1B7A3A; --err:#B3261E; --warn:#B26A00; --paper:#fff; --bg:#F5F8FD;
  --fd:"Fredoka","Trebuchet MS",system-ui,sans-serif; --fb:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif; color-scheme:light; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 var(--fb); }
body { min-height:100vh; padding-bottom:calc(76px + env(safe-area-inset-bottom)); }
button,input { font:inherit; color:inherit; }
button { cursor:pointer; }
[hidden] { display:none !important; }
.top { position:sticky; top:0; z-index:20; background:var(--blue); color:#fff; padding:calc(10px + env(safe-area-inset-top)) 16px 10px; display:flex; align-items:center; gap:10px; }
.top h1 { font:600 1.15rem var(--fd); margin:0; flex:1; }
.top small { opacity:.85; font-size:.75rem; display:block; font-weight:600; }
.ibtn { border:0; background:rgba(255,255,255,.18); color:#fff; width:40px; height:40px; border-radius:50%; font-size:1.2rem; display:grid; place-items:center; }
.wrap { max-width:720px; margin:0 auto; padding:12px 14px 20px; }
.nav { position:fixed; left:0; right:0; bottom:0; z-index:20; background:#fff; border-top:1px solid var(--line); display:flex; padding-bottom:env(safe-area-inset-bottom); }
.nav button { flex:1; border:0; background:none; padding:10px 4px 9px; display:grid; gap:2px; justify-items:center; font-size:.72rem; font-weight:700; color:var(--soft); }
.nav button svg { width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
.nav button.on { color:var(--blue); }
.chips { display:flex; gap:8px; overflow-x:auto; padding:2px 0 10px; scrollbar-width:none; }
.chips::-webkit-scrollbar { display:none; }
.chip { flex:none; border:1.5px solid var(--line); background:#fff; border-radius:999px; padding:7px 13px; font-weight:700; font-size:.85rem; color:var(--soft); }
.chip b { font-weight:800; margin-left:4px; }
.chip.on { background:var(--blue); border-color:var(--blue); color:#fff; }
.search { width:100%; border:1.5px solid var(--line); border-radius:12px; padding:11px 14px; background:#fff; margin-bottom:10px; }
.search:focus,.inp:focus { outline:2px solid #6FA4F2; border-color:var(--blue); }
.card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:12px; box-shadow:0 1px 3px rgba(12,34,71,.05); }
.card.dim { opacity:.62; }
.row { display:flex; align-items:flex-start; gap:10px; justify-content:space-between; }
.nm { font:600 1.05rem var(--fd); }
.id { color:var(--soft); font-size:.75rem; font-weight:700; }
.tot { font:600 1.1rem var(--fd); color:var(--blue); white-space:nowrap; }
.meta { color:var(--soft); font-size:.82rem; margin-top:2px; }
.items { margin:8px 0; padding:9px 11px; background:var(--sky); border-radius:10px; font-size:.9rem; white-space:pre-wrap; word-break:break-word; }
.note { font-size:.82rem; color:var(--warn); font-weight:700; margin-bottom:8px; }
.tgl { display:flex; gap:8px; flex-wrap:wrap; margin-top:6px; }
.tg { flex:1 1 90px; border:2px solid var(--line); background:#fff; border-radius:12px; padding:10px 6px; font-weight:800; font-size:.88rem; color:var(--soft); display:flex; align-items:center; justify-content:center; gap:6px; }
.tg.on { background:var(--ok); border-color:var(--ok); color:#fff; }
.tg:disabled { opacity:.5; }
.acts { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
.sm { border:1.5px solid var(--line); background:#fff; border-radius:10px; padding:7px 12px; font-weight:700; font-size:.82rem; color:var(--blue); text-decoration:none; display:inline-block; }
.sm.red { color:var(--err); border-color:#F0C2BE; }
.sm.red.arm { background:var(--err); color:#fff; border-color:var(--err); }
.badge { display:inline-block; font-size:.72rem; font-weight:800; padding:2px 9px; border-radius:999px; background:#FDE7E5; color:var(--err); }
.badge.g { background:#E3F4E8; color:var(--ok); } .badge.b { background:var(--sky); color:var(--blue); } .badge.o { background:#FFF1D6; color:var(--warn); }
.inp { border:1.5px solid var(--line); border-radius:10px; padding:9px 11px; background:#fff; width:100%; }
.pr { display:flex; align-items:center; gap:6px; }
.pr span { font-weight:800; color:var(--soft); }
.pr .inp { width:110px; font-weight:700; }
.sw { display:flex; align-items:center; gap:8px; font-weight:700; font-size:.85rem; color:var(--soft); }
.sw i { width:44px; height:26px; border-radius:999px; background:#C5D0E3; position:relative; transition:.15s; flex:none; }
.sw i::after { content:""; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:.15s; }
.sw.on i { background:var(--ok); } .sw.on i::after { left:21px; }
.sw.warn.on i { background:var(--err); }
.help { background:var(--sky); border-radius:12px; padding:11px 13px; font-size:.86rem; color:var(--ink); margin-bottom:12px; }
.empty { text-align:center; color:var(--soft); padding:34px 10px; }
.login { min-height:100vh; display:grid; place-content:center; justify-items:center; gap:18px; text-align:center; padding:24px; }
.login img { width:150px; }
.login h2 { font:600 1.3rem var(--fd); margin:0; }
.login p { color:var(--soft); margin:0; max-width:300px; }
.err { color:var(--err); font-weight:700; max-width:320px; }
.toast { position:fixed; left:50%; bottom:calc(88px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 16px; border-radius:12px; font-weight:700; font-size:.88rem; z-index:50; max-width:90vw; }
.demo { background:#FFF1D6; color:var(--warn); text-align:center; font-weight:800; font-size:.78rem; padding:4px; }
.add { display:grid; gap:8px; margin-top:6px; }
.btn { border:0; background:var(--blue); color:#fff; border-radius:12px; padding:12px; font-weight:800; }
.btn:disabled { opacity:.5; }
.ibtn svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}

.kpi span{font-size:.78rem;color:#667}
.hero{background:#0F59C4;color:#fff;border-radius:18px;padding:18px;margin-bottom:12px}
.hero small{opacity:.8;display:block}.hero b{font-size:1.9rem;display:block;margin:4px 0}
.menu{background:#fff;border-radius:16px;border:1px solid #e3eaf6;overflow:hidden}
.mi{display:flex;align-items:center;gap:14px;width:100%;border:0;border-bottom:1px solid #eef2f9;background:none;padding:16px;font:inherit;text-align:left;color:inherit}
.mi:last-child{border-bottom:0}.mi i{width:40px;height:40px;border-radius:50%;background:#e8f0fd;display:grid;place-items:center;font-style:normal;font-size:1.2rem}
.mi b{display:block}.mi span{font-size:.82rem;color:#667}
.back{border:0;background:none;color:#0F59C4;font:inherit;font-weight:700;padding:4px 0 10px}
.frow{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eef2f9}
.frow.t{font-weight:800}
.yr{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:10px;font-weight:800}
.yr button{border:0;background:#e8f0fd;color:#0F59C4;width:36px;height:36px;border-radius:50%;font-size:1.1rem}
.tour{position:fixed;inset:0;z-index:50;touch-action:none}
.tour .hole{position:absolute;border-radius:14px;box-shadow:0 0 0 9999px rgba(10,20,40,.68);border:2px solid #fff;transition:all .25s;pointer-events:none}
.tour .tcard{position:absolute;background:#fff;border-radius:18px;padding:16px 16px 12px;box-shadow:0 10px 40px rgba(0,0,0,.35);width:min(340px,calc(100vw - 24px));left:50%;transform:translateX(-50%)}
.tour .tcard h3{margin:0 0 6px;font-size:1.05rem;color:#0F59C4}
.tour .tcard p{margin:0 0 12px;line-height:1.4;color:#333;font-size:.94rem}
.tour .dots{display:flex;gap:6px;justify-content:center;margin-bottom:10px}
.tour .dots i{width:7px;height:7px;border-radius:50%;background:#cfd8e8}.tour .dots i.on{background:#0F59C4}
.tour .trow{display:flex;gap:8px}
.tour .trow button{flex:1;padding:11px;border-radius:12px;border:1px solid #0F59C4;background:#fff;color:#0F59C4;font:inherit;font-weight:700}
.tour .trow button.pri{background:#0F59C4;color:#fff}
.tour .skip{display:block;margin:8px auto 0;border:0;background:none;color:#777;font:inherit;font-size:.82rem}
</style>
</head>
<body>
<div id="login" class="login" hidden>
  <img src="img/logo.png" alt="Uovo">
  <h2>Administración</h2>
  <p>Ingresá con tu cuenta de Google. Solo entran las cuentas autorizadas.</p>

<div id="app" hidden>
  <div id="demobar" class="demo" hidden>MODO DEMO · datos de ejemplo, no se guarda nada</div>
  <header class="top">
    <h1>Uovo Admin<small id="who"></small></h1>
    <button class="ibtn" id="wand" aria-label="Ayuda"><svg viewBox="0 0 24 24"><path d="M4 20 15 9"/><path d="m14 4 .8 2.2L17 7l-2.2.8L14 10l-.8-2.2L11 7l2.2-.8zM19 12l.5 1.3 1.3.5-1.3.5-.5 1.3-.5-1.3-1.3-.5 1.3-.5z"/></svg></button>

    <button data-v="pedidos"><svg viewBox="0 0 24 24"><path d="M6 3h12l2 4v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7z"/><path d="M4 7h16M9 11a3 3 0 0 0 6 0"/></svg>Pedidos</button>
    <button data-v="productos"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 9h.01M15 8h.01M10 14h.01M15 14h.01M12 11h.01"/></svg>Productos</button>
    <button data-v="mas"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>Más</button>
  </nav>
</div>
<div id="toast" class="toast" hidden></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
(function () {
  var ENDPOINT = "https://script.google.com/macros/s/AKfycbwRgztSNbcqRVjj6Kji1BbUCoZxAdQlYLYPxf5-266YiG16hzG9J4II1L7qhxlENjmZNA/exec";
  var DEMO = /[?&]demo=1/.test(location.search);
  var $ = function (id) { return document.getElementById(id); };
  var st = { token: "", me: null, v: "inicio", fil: "pend", q: "", pedidos: [], productos: [], accesos: [], packs: [], recetas: [], fin: null, loaded: {} };
  function store(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function money(n) { return "$" + Math.round(Number(n) || 0).toLocaleString("es-AR"); }
  var tt = null;
  function toast(m) { var t = $("toast"); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(function () { t.hidden = true; }, 2800); }

  /* ---------- Demo ---------- */
  var demo = {
    pedidos: [
      { r: 5, id: "U-A1B2", fecha: "12/10/2026 09:14", nombre: "Lucía Pérez", tel: "2915551234", mail: "lucia@mail.com", pedido: "2 x Red Velvet, 1 x Chocomarsh", cant: 3, total: 7500, entrega: "viernes, 30 de octubre", pago: "Transferencia", ap: false, he: false, en: false, notas: "", cc: false, cl: false, cupon: "", estado: "pendiente" },
      { r: 4, id: "U-C3D4", fecha: "11/10/2026 19:13", nombre: "Mariano Gil", tel: "2914391046", mail: "m@mail.com", pedido: "PACK 3 cookies $6000 (1 Red Velvet + 2 Chocomarsh)", cant: 3, total: 6000, entrega: "viernes, 30 de octubre", pago: "Efectivo", ap: true, he: false, en: false, notas: "Retira en persona", cc: false, cl: false, cupon: "", estado: "aprobado" },
      { r: 3, id: "U-E5F6", fecha: "10/10/2026 21:02", nombre: "Sofi R.", tel: "2916660000", mail: "s@mail.com", pedido: "4 x Trichoc", cant: 4, total: 9000, entrega: "viernes, 30 de octubre", pago: "Pago full", ap: true, he: true, en: false, notas: "", cc: false, cl: false, cupon: "", estado: "hecho" },
      { r: 2, id: "U-G7H8", fecha: "09/10/2026 12:40", nombre: "Pedro", tel: "2917770000", mail: "p@mail.com", pedido: "1 x Limón & Choco Blanco", cant: 1, total: 2500, entrega: "viernes, 30 de octubre", pago: "", ap: false, he: false, en: false, notas: "", cc: false, cl: true, cupon: "", estado: "cancelado" }
    ],
    productos: [
      { r: 2, vi: true, nombre: "Red Velvet", precio: 2500, ag: false, costo: 165.6, cat: "Clásicas" },
      { r: 3, vi: true, nombre: "Chocomarsh", precio: 2500, ag: false, costo: null, cat: "Clásicas" },
      { r: 4, vi: true, nombre: "Trichoc", precio: 2500, ag: true, costo: 210, cat: "Clásicas" }

      { r: 2, ac: true, tipo: "Pack", nombre: "Pack x3", q: 3, precio: 6500, lim: 0, vence: "", normal: 7500, ahorro: 1000, ganancia: 3200 },
      { r: 3, ac: false, tipo: "Combo", nombre: "Combo Red + Choco", q: 2, precio: 4500, lim: 20, vence: "31/10/2026", normal: 5000, ahorro: 500, ganancia: 2100 }
    ],
    recetas: [{ nombre: "Red Velvet", masa: 2150, q: 13, costo: 480 }, { nombre: "Trichoc", masa: 2600, q: 14, costo: 520 }],
    fin: { ok: true, anio: "2026", filas: [["Año", "2026"], ["Período (auxiliar)", "202601"], ["Estado de resultados", "Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Sep", "Oct", "Nov", "Dic", "Total"], ["Cookies vendidas", "0", "0", "0", "0", "0", "0", "0", "0", "40", "62", "0", "0", "102"], ["Ventas brutas", "$0", "$0", "$0", "$0", "$0", "$0", "$0", "$0", "$100.000", "$155.000", "$0", "$0", "$255.000"], ["Ventas netas", "$0", "$0", "$0", "$0", "$0", "$0", "$0", "$0", "$95.000", "$150.000", "$0", "$0", "$245.000"], ["Resultado neto", "$0", "$0", "$0", "$0", "$0", "$0", "$0", "$0", "$40.000", "$70.000", "$0", "$0", "$110.000"]] },
    accesos: [{ r: 2, email: "fakundo713@gmail.com", nota: "Dueña/o", permisos: "Dueño", activo: true }]
  };
  function api(op, extra) {
    if (DEMO) return new Promise(function (res) { setTimeout(function () {
      var d = JSON.parse(JSON.stringify(demo));
      if (op === "me") return res({ ok: true, email: "demo@uovo.com", nombre: "Demo", rol: "Dueño" });
      if (op === "pedidos") return res({ ok: true, pedidos: d.pedidos });
      if (op === "productos") return res({ ok: true, productos: d.productos });
      if (op === "accesos") return res({ ok: true, accesos: d.accesos });
      if (op === "packs") return res({ ok: true, packs: d.packs });
      if (op === "recetas") return res({ ok: true, recetas: d.recetas });
      if (op === "finanzas" || op === "setAnio") return res(d.fin);
      if (op === "setPack") return res({ ok: true });
      if (op === "setPedido") { var p = demo.pedidos.filter(function (x) { return x.r === extra.r; })[0]; p[extra.campo] = extra.valor; return res({ ok: true, p: p }); }
      res({ ok: true, accesos: d.accesos });
    }, 150); });
    var body = { admin: 1, token: st.token, op: op };
    for (var k in extra) body[k] = extra[k];
    return fetch(ENDPOINT, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) }).then(function (r) { return r.json(); }).then(function (j) {
      if (j && j.error === "auth") { signedOut("Tu sesión venció. Volvé a ingresar."); throw new Error("auth"); }
      if (j && j.error === "denied") { signedOut(j.email ? "La cuenta " + j.email + " no tiene acceso." : (j.msg || "Sin permiso.")); throw new Error("denied"); }
      return j;
    });
  }

  /* ---------- Sesión ---------- */
  var clientId = "";
  function showLogin(msg) {
    $("app").hidden = true; $("login").hidden = false;
    var e = $("lerr"); e.hidden = !msg; e.textContent = msg || "";
  }
  function signedOut(msg) { st.token = ""; st.me = null; store("uovo_adm_tok", null); showLogin(msg); try { if (window.google && google.accounts) google.accounts.id.disableAutoSelect(); } catch (e) {} }
  function enter(me) {
    st.me = me; $("login").hidden = true; $("app").hidden = false; $("who").textContent = me.email + " · " + (me.rol || "");
    $("demobar").hidden = !DEMO;
    goto(st.v === "accesos" && me.rol !== "Dueño" ? "mas" : st.v);
  }
  function onCred(resp) {
    st.token = resp.credential; store("uovo_adm_tok", st.token);
    api("me").then(function (j) { if (j && j.ok) enter(j); else showLogin("No se pudo ingresar."); }).catch(function () {});
  }
  function initGoogle() {
    if (!window.google || !google.accounts) { setTimeout(initGoogle, 300); return; }
    google.accounts.id.initialize({ client_id: clientId, callback: onCred, auto_select: true, cancel_on_tap_outside: false });
    google.accounts.id.renderButton($("gbtn"), { theme: "filled_blue", size: "large", shape: "pill", text: "signin_with", locale: "es" });
  }
  function boot() {
    if (DEMO) { st.token = "demo"; api("me").then(enter); return; }
    var tok = load("uovo_adm_tok");
    fetch(ENDPOINT).then(function (r) { return r.json(); }).then(function (j) {
      clientId = String(j && j.config && j.config.google_client_id || "").trim();
      if (!clientId) { showLogin("Falta configurar el ID de cliente de Google en la hoja Config."); return; }
      if (tok) { st.token = tok; api("me").then(function (m) { if (m && m.ok) enter(m); else showLogin(); }).catch(function () { showLogin(); initGoogle(); }); }
      else { showLogin(); }
      initGoogle();
    }).catch(function () { showLogin("No se pudo conectar. Revisá tu conexión."); });
  }

  /* ---------- Navegación ---------- */
  var SUB = ["packs", "recetas", "finanzas", "accesos"];
  function goto(v) {
    st.v = v; var nk = SUB.indexOf(v) >= 0 ? "mas" : v;
    Array.prototype.forEach.call($("nav").querySelectorAll("button"), function (b) { b.classList.toggle("on", b.getAttribute("data-v") === nk); });
    if (v === "mas") st.loaded.mas = true;
    if (!st.loaded[v]) { $("view").innerHTML = '<div class="empty">Cargando…</div>'; fetchView(v); } else render();
    window.scrollTo(0, 0);
  }
  function fetchView(v) {
    var op = v === "inicio" ? "pedidos" : v;
    api(op).then(function (j) {
      if (!j || !j.ok) { $("view").innerHTML = '<div class="empty">No se pudo cargar. ' + esc(j && j.msg || "") + "</div>"; return; }

      st.loaded[v] = true; if (op === "pedidos") { st.loaded.pedidos = true; st.loaded.inicio = true; }
      if (st.v === v) render();
    }).catch(function () { if (st.v === v) $("view").innerHTML = '<div class="empty">No se pudo cargar.</div>'; });
  }
  $("nav").addEventListener("click", function (e) { var b = e.target.closest("button[data-v]"); if (b) goto(b.getAttribute("data-v")); });
  $("refresh").addEventListener("click", function () { st.loaded = {}; goto(st.v); });
  $("logout").addEventListener("click", function () { signedOut(""); });

  /* ---------- Pedidos ---------- */
  function estadoDe(p) { if (p.cc || p.cl) return "canc"; if (p.en) return "ent"; if (p.he) return "list"; if (p.ap) return "coc"; return "pend"; }
  var FILS = [["pend", "Pendientes"], ["coc", "A cocinar"], ["list", "Listos"], ["ent", "Entregados"], ["canc", "Cancelados"], ["todos", "Todos"]];

        api("setAcceso", { r: r, activo: !a.activo }).then(function (j) { if (j && j.ok) { st.accesos = j.accesos; render(true); } });
      } else {
        var d = t.closest("[data-del]"); if (!d) return;
        if (d.classList.contains("arm")) api("delAcceso", { r: r }).then(function (j) { if (j && j.ok) { st.accesos = j.accesos; render(true); toast("Acceso quitado"); } });
        else { d.classList.add("arm"); d.textContent = "¿Seguro? Tocá de nuevo"; clearTimeout(armTimer); armTimer = setTimeout(function () { d.classList.remove("arm"); d.textContent = "Quitar acceso"; }, 3000); }
      }
    }
  });

  if ("serviceWorker" in navigator && !DEMO) navigator.serviceWorker.register("admin-sw.js").catch(function () {});
  boot();
})();
</script>
</body>
</html>
